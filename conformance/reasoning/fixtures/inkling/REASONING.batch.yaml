family: inkling
model_label: Inkling
mode: batch
spec: https://huggingface.co/thinkingmachines/Inkling-NVFP4
captured_with:
  dynamo_rust: Dynamo inkling reasoning parser (this crate)
  sglang_python: sglang inkling ReasoningParser (lmsysorg/sglang:inkling-cu13), captured 2026-07-16
  vllm_python: vLLM InklingParser (vllm/parser/inkling.py, unified ParserEngine) via extract_reasoning(); parser source vllm main @ c95c6630, captured 2026-07-16
refs:
  local: &local_ref 'Inkling block-structured reasoning grammar (<|content_thinking|> / <|content_text|> segments)'
  e2e: &e2e_ref 'Real e2e capture: Inkling served on dynamo.sglang + dynamo.frontend (raw, parsing-off; skip_special_tokens=False), model_text is the verbatim marker-ful decode of the generated output token-ids (reasoning_effort=high).'
cases:
  REASONING.batch.1.a:
    description: Empty input
    ref: *local_ref
    model_text: ''
    expected:
      dynamo: &d_1a
        reasoning_text: ''
        normal_text: ''
      vllm: *d_1a
      sglang: *d_1a
  REASONING.batch.1.b:
    description: Plain text without reasoning markers
    ref: *local_ref
    model_text: plain answer
    expected:
      dynamo: &d_1b
        reasoning_text: ''
        normal_text: plain answer
      vllm:
        reasoning_text: ''
        normal_text: ''
        reason: 'vLLM InklingParser hard-sets initial_state=MESSAGE_HEADER (non-streaming parse receives only the generated suffix after a prompt-prefilled <|message_model|>), so text before any content-kind marker (<|content_text|>/<|content_thinking|>) is treated as message-header metadata and dropped. dynamo/sglang surface pre-marker text as normal_text. Divergence only manifests on marker-less input, which does not occur after a real Inkling prefill.'
      sglang: *d_1b
  REASONING.batch.2.a:
    description: Reasoning block followed by a content answer block
    ref: *local_ref
    model_text: '<|message_model|><|content_thinking|>The user asks a simple arithmetic question. 2+2=4.<|end_message|><|message_model|><|content_text|>2 + 2 = 4.<|end_message|><|content_model_end_sampling|>'
    expected:
      dynamo: &d_2a
        reasoning_text: The user asks a simple arithmetic question. 2+2=4.
        normal_text: 2 + 2 = 4.
      vllm: *d_2a
      sglang: *d_2a
  REASONING.batch.2.b:
    description: Reasoning block only (no content block)
    ref: *local_ref
    model_text: '<|message_model|><|content_thinking|>thinking<|end_message|>'
    expected:
      dynamo: &d_2b
        reasoning_text: thinking
        normal_text: ''
      vllm: *d_2b
      sglang: *d_2b
  REASONING.batch.2.c:
    description: Content block only (no reasoning block)
    ref: *local_ref
    model_text: '<|message_model|><|content_text|>2 + 2 = 4.<|end_message|>'
    expected:
      dynamo: &d_2c
        reasoning_text: ''
        normal_text: 2 + 2 = 4.
      vllm: *d_2c
      sglang: *d_2c
  REASONING.batch.3.a:
    description: Reasoning followed by a tool-call block preserved verbatim for the downstream tool parser
    ref: *local_ref
    model_text: '<|message_model|><|content_thinking|>I should call the weather tool for Paris.<|end_message|><|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"Paris","unit":"celsius"}}<|end_message|><|content_model_end_sampling|>'
    expected:
      dynamo:
        reasoning_text: I should call the weather tool for Paris.
        normal_text: '<|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"Paris","unit":"celsius"}}<|end_message|>'
        reason: The reasoning parser runs before the tool parser, so the tool-call block passes through verbatim into normal_text; only the trailing terminator is stripped.
      vllm:
        reasoning_text: I should call the weather tool for Paris.
        normal_text: ''
        reason: 'vLLM uses a single unified ParserEngine: its reasoning pass already classifies the <|content_invoke_tool_json|> block as a tool-call event and consumes it, so normal_text is empty (no tool markup leaks). dynamo/sglang run reasoning before a separate tool stage, so the tool block passes through verbatim into normal_text for the tool parser. Reasoning_text is identical across all three.'
      sglang:
        reasoning_text: I should call the weather tool for Paris.
        normal_text: '<|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"Paris","unit":"celsius"}}<|end_message|>'
  REASONING.batch.5:
    description: Missing end marker keeps the remaining reasoning text as reasoning
    ref: *local_ref
    model_text: '<|message_model|><|content_thinking|>partial reasoning'
    expected:
      dynamo: &d_5
        reasoning_text: partial reasoning
        normal_text: ''
      vllm: *d_5
      sglang: *d_5
  REASONING.batch.7:
    description: Reasoning-then-answer happy path from a real e2e capture; header-less <|content_thinking|> block then a <|message_model|><|content_text|> answer block (reasoning_effort=high)
    ref: *e2e_ref
    model_text: |-
      <|content_thinking|>The user is asking for 15 times 12, and wants me to show my reasoning. This is a simple multiplication problem. I should provide the answer and explain how I calculated it.

      15 × 12 can be calculated in several ways:
      1. Direct multiplication: 15 × 10 + 15 × 2 = 150 + 30 = 180
      2. Breaking down 12: 12 × 15 = 12 × (10 + 5) = 120 + 60 = 180
      3. Breaking down 15: 15 × 12 = (10 + 5) × 12 = 120 + 60 = 180
      4. Double and halve: 15 × 12 = 30 × 6 = 180, or 7.5 × 24, etc.
      5. Standard algorithm: 15 × 12 = 15 × 2 × 6 = 30 × 6 = 180, etc.

      I'll show a clear reasoning, probably using the distributive property since it's easy to understand.

      Answer: 180.

      Let me present this clearly.<|end_message|><|message_model|><|content_text|>15 × 12 = **180**

      Here is one way to reason through it using the distributive property:

      Break 12 into 10 and 2:
      - 15 × 10 = 150
      - 15 × 2 = 30

      Then add them together:
      - 150 + 30 = **180**

      Another way is to break 15 into 10 and 5:
      - 10 × 12 = 120
      - 5 × 12 = 60
      - 120 + 60 = **180**<|end_message|><|content_model_end_sampling|>
    expected:
      dynamo: &d_7
        reasoning_text: |-
