          3. Breaking down 15: 15 × 12 = (10 + 5) × 12 = 120 + 60 = 180
          4. Double and halve: 15 × 12 = 30 × 6 = 180, or 7.5 × 24, etc.
          5. Standard algorithm: 15 × 12 = 15 × 2 × 6 = 30 × 6 = 180, etc.

          I'll show a clear reasoning, probably using the distributive property since it's easy to understand.

          Answer: 180.

          Let me present this clearly.
        normal_text: |-
          15 × 12 = **180**

          Here is one way to reason through it using the distributive property:

          Break 12 into 10 and 2:
          - 15 × 10 = 150
          - 15 × 2 = 30

          Then add them together:
          - 150 + 30 = **180**

          Another way is to break 15 into 10 and 5:
          - 10 × 12 = 120
          - 5 × 12 = 60
          - 120 + 60 = **180**
      sglang: *d_7
      vllm:
        reasoning_text: |-
          The user is asking for 15 times 12, and wants me to show my reasoning. This is a simple multiplication problem. I should provide the answer and explain how I calculated it.

          15 × 12 can be calculated in several ways:
