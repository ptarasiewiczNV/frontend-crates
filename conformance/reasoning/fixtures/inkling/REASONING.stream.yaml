family: inkling
model_label: Inkling
mode: stream
spec: https://huggingface.co/thinkingmachines/Inkling-NVFP4
refs:
  local: &local_ref 'Inkling block-structured reasoning grammar (<|content_thinking|> / <|content_text|> segments)'
cases:
  REASONING.stream.1.a:
    description: Empty stream chunk
    ref: *local_ref
    chunks:
    - ''
    expected:
      dynamo:
        reasoning_text: ''
        normal_text: ''
      vllm: &vllm_unavailable
        unavailable: vLLM in this conformance harness does not include an Inkling reasoning parser.
      sglang: &sglang_unavailable
        unavailable: SGLang in this conformance harness does not include an Inkling reasoning parser.
  REASONING.stream.1.b:
    description: Plain text without reasoning markers
    ref: *local_ref
    chunks:
    - plain
    - ' answer'
    expected:
      dynamo:
        reasoning_text: ''
        normal_text: plain answer
      vllm: *vllm_unavailable
      sglang: *sglang_unavailable
  REASONING.stream.2.a:
    description: Reasoning and content split across chunks
    ref: *local_ref
    chunks:
    - '<|message_model|><|content_thinking|>rea'
    - 'son<|end_message|><|message_model|><|content_text|>ans'
    - 'wer<|end_message|>'
    expected:
      dynamo:
        reasoning_text: reason
        normal_text: answer
      vllm: *vllm_unavailable
      sglang: *sglang_unavailable
  REASONING.stream.3.a:
    description: Content-type start marker split across chunks stays undecided until complete
    ref: *local_ref
    chunks:
    - '<|message_model|><|content_thin'
    - 'king|>reason<|end_message|>'
    expected:
      dynamo:
        reasoning_text: reason
        normal_text: ''
      vllm: *vllm_unavailable
      sglang: *sglang_unavailable
  REASONING.stream.3.b:
    description: End marker split across chunks
    ref: *local_ref
    chunks:
    - '<|message_model|><|content_thinking|>reason<|end_mes'
    - 'sage|><|message_model|><|content_text|>answer<|end_message|>'
    expected:
      dynamo:
        reasoning_text: reason
        normal_text: answer
      vllm: *vllm_unavailable
      sglang: *sglang_unavailable
  REASONING.stream.3.c:
    description: Tool-call block preserved verbatim into normal_text after a reasoning span
    ref: *local_ref
    chunks:
    - '<|message_model|><|content_thinking|>use weather tool<|end_message|>'
    - '<|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"Paris"}}<|end_message|>'
    expected:
      dynamo:
        reasoning_text: use weather tool
        normal_text: '<|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"Paris"}}<|end_message|>'
        reason: The tool-call block is passed through verbatim so the downstream tool parser can extract it.
      vllm: *vllm_unavailable
      sglang: *sglang_unavailable
