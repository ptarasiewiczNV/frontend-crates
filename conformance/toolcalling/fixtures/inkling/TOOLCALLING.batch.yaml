family: inkling
model_label: Inkling
mode: batch
spec: https://huggingface.co/thinkingmachines/Inkling-NVFP4
captured_with:
  dynamo_rust: Dynamo inkling parser (this crate)
  sglang_python: sglang inkling FunctionCallParser (lmsysorg/sglang:inkling-cu13), captured 2026-07-16
  vllm_python: vLLM InklingParser (vllm/parser/inkling.py, unified ParserEngine) via extract_tool_calls(); parser source vllm main @ c95c6630, captured 2026-07-16
refs:
  local: &local_ref 'Inkling chat_template.jinja tool-call markup (<|content_invoke_tool_json|> ... <|end_message|>)'
  e2e: &e2e_ref 'Real e2e capture: Inkling served on dynamo.sglang + dynamo.frontend (raw, parsing-off; skip_special_tokens=False), model_text is the verbatim marker-ful decode of the generated output token-ids.'
cases:
  TOOLCALLING.batch.1:
    description: Single tool call (happy path)
    ref: *local_ref
    model_text: '<|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"Paris","unit":"celsius"}}<|end_message|>'
    tools:
    - &weather_tool
      name: get_weather
      parameters:
        type: object
        properties:
          location:
            type: string
          unit:
            type: string
    expected:
      dynamo: &d_1
        calls:
        - name: get_weather
          arguments:
            location: Paris
            unit: celsius
        normal_text: ''
      vllm: *d_1
      sglang: *d_1
  TOOLCALLING.batch.1.a:
    description: Minimal single call
    ref: *local_ref
    model_text: '<|message_model|>weather<|content_invoke_tool_json|>{"name":"weather","args":{"city":"SF"}}<|end_message|>'
    tools:
    - *weather_tool
    expected:
      dynamo: &d_1a
        calls:
        - name: weather
          arguments:
            city: SF
        normal_text: ''
      vllm: *d_1a
      sglang: *d_1a
  TOOLCALLING.batch.2:
    description: Headerless legacy call (no <|message_model|> header) still parses
    ref: *local_ref
    model_text: '<|content_invoke_tool_json|>{"name":"weather","args":{"city":"SF"}}<|end_message|>'
    tools:
    - *weather_tool
    expected:
      dynamo: &d_2
        calls:
        - name: weather
          arguments:
            city: SF
        normal_text: ''
      vllm: *d_2
      sglang: *d_2
  TOOLCALLING.batch.3:
    description: No tool call (plain text)
    ref: *local_ref
    model_text: Hello, how can I help you today?
    tools:
    - *weather_tool
    expected:
      dynamo: &d_3
        calls: []
        normal_text: Hello, how can I help you today?
      vllm:
        calls: []
        normal_text: ''
        reason: 'vLLM InklingParser hard-sets initial_state=MESSAGE_HEADER (non-streaming parse receives only the generated suffix after a prompt-prefilled <|message_model|>), so plain text before any content-kind marker is treated as message-header metadata and dropped. dynamo/sglang surface it as normal_text. Divergence only on marker-less input, which does not occur after a real Inkling prefill.'
      sglang: *d_3
  TOOLCALLING.batch.4:
    description: Two calls back-to-back with trailing terminator
    ref: *local_ref
    model_text: '<|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"Paris"}}<|end_message|><|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"London"}}<|end_message|><|content_model_end_sampling|>'
    tools:
    - *weather_tool
    expected:
      dynamo: &d_4
        calls:
        - name: get_weather
          arguments:
            location: Paris
        - name: get_weather
          arguments:
            location: London
        normal_text: ''
      vllm: *d_4
      sglang: *d_4
  TOOLCALLING.batch.5:
    description: Prefix prose before the tool-call block is kept as normal_text, header stripped
    ref: *local_ref
    model_text: 'Let me check that for you. <|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"NYC"}}<|end_message|>'
    tools:
    - *weather_tool
    expected:
      dynamo:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'Let me check that for you.'
      vllm:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: ''
        reason: 'vLLM parses the tool call identically but drops the "Let me check that for you." prefix: initial_state=MESSAGE_HEADER treats text before the first content-kind marker as header metadata. dynamo trim_end()s and keeps it as normal_text; sglang keeps it with trailing space. All three agree on the call.'
      sglang:
        calls:
        - name: get_weather
          arguments:
            location: NYC
        normal_text: 'Let me check that for you. '
        reason: 'sglang preserves the prefix trailing space; dynamo trim_end()s the prefix. Cosmetic whitespace divergence.'
  TOOLCALLING.batch.5.c:
    description: Truncation mid-argument value is dropped (ambiguous, never guessed)
    ref: *local_ref
    model_text: '<|content_invoke_tool_json|>{"name":"weather","args":{"city":"S'
    tools:
    - *weather_tool
    expected:
      dynamo:
        calls: []
        normal_text: ''
      vllm:
        calls:
        - name: weather
          arguments_raw: '{"city":"S'
          arguments_valid: false
        normal_text: ''
        reason: 'vLLM surfaces the truncated call with a name but unterminated/invalid args ("{\"city\":\"S", arguments_json_valid=false); it neither guesses nor drops. dynamo drops it entirely (calls=[], goal 3: never emit an ambiguous call); sglang leaks the raw markup into normal_text. All three diverge; dynamo behavior is preferred.'
      sglang:
        calls: []
        normal_text: '<|content_invoke_tool_json|>{"name":"weather","args":{"city":"S'
        reason: 'sglang leaks the truncated tool markup into normal_text; dynamo drops it (goal 3: never leak tool-call markup). Dynamo behavior is preferred here.'
  TOOLCALLING.batch.7:
    description: Typed-args tool call (integer + boolean) from a real e2e capture; header-less generation-primer block
    ref: *e2e_ref
    model_text: 'book_flight<|content_invoke_tool_json|>{"name":"book_flight","args":{"destination":"Paris","first_class":true,"passengers":2}}<|end_message|><|content_model_end_sampling|>'
    tools:
    - name: book_flight
      parameters:
        type: object
        properties:
          destination:
            type: string
          passengers:
            type: integer
          first_class:
            type: boolean
        required:
        - destination
        - passengers
        - first_class
    expected:
      dynamo:
        calls:
        - name: book_flight
          arguments:
            destination: Paris
            first_class: true
            passengers: 2
        normal_text: ''
        reason: 'Real Inkling capture. add_generation_prompt consumes the leading <|message_model|>, so the model emits the tool block header-less (NAME first): book_flight<|content_invoke_tool_json|>... A header-less prefix that exactly equals the parsed call name is the redundant call header, not content, so the parser drops it (normal_text=""). Real prose prefixes never equal the tool name, so they are still preserved as normal_text (see batch.5). This keeps the tool name out of the content channel even when the tool parser runs standalone; in the two-stage pipeline the reasoning parser also reconstructs the header upstream (see REASONING.batch.7). Typed args (integer passengers, boolean first_class) preserved verbatim via RawValue.'
      vllm:
        calls:
        - name: book_flight
          arguments:
            destination: Paris
            first_class: true
            passengers: 2
        normal_text: ''
        reason: 'real-trace peer capture pending: vLLM InklingParser not re-stood-up for this live capture. vLLM drops the bare NAME via initial_state=MESSAGE_HEADER; dynamo now agrees (header-less redundant-name drop). Args/name expected identical.'
      sglang:
        calls:
        - name: book_flight
          arguments:
            destination: Paris
            first_class: true
            passengers: 2
        normal_text: 'book_flight'
        reason: 'Real capture: the sglang InklingDetector (bundled in the live worker) run on this exact model_text surfaces the bare NAME as normal_text. dynamo and vLLM drop the header-less redundant NAME; sglang keeps it. Typed args identical.'
  TOOLCALLING.batch.9.a:
    description: Empty model text
    ref: *local_ref
    model_text: ''
    tools:
    - *weather_tool
    expected:
      dynamo: &d_9a
        calls: []
        normal_text: ''
      vllm: *d_9a
      sglang: *d_9a
  TOOLCALLING.batch.9.b:
    description: Blank / whitespace-only model text
    ref: *local_ref
    model_text: '   '
    tools:
    - *weather_tool
    expected:
      dynamo: &d_9b
        calls: []
        normal_text: '   '
      vllm:
        calls: []
        normal_text: ''
        reason: 'vLLM drops the whitespace-only input (no content-kind marker -> treated as message-header metadata under initial_state=MESSAGE_HEADER). dynamo/sglang preserve the whitespace as normal_text.'
      sglang: *d_9b
  TOOLCALLING.batch.10:
    description: Duplicate calls (same name twice)
    ref: *local_ref
    model_text: '<|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"NYC"}}<|end_message|><|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"LA"}}<|end_message|>'
    tools:
    - *weather_tool
    expected:
      dynamo: &d_10
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: get_weather
          arguments:
            location: LA
        normal_text: ''
      vllm: *d_10
      sglang: *d_10
  TOOLCALLING.batch.13:
    description: Unknown tool name absent from supplied tools is still surfaced
    ref: *local_ref
    model_text: '<|message_model|>unknown_tool<|content_invoke_tool_json|>{"name":"unknown_tool","args":{"location":"NYC"}}<|end_message|>'
    tools:
    - *weather_tool
    expected:
      dynamo: &d_13
        calls:
        - name: unknown_tool
          arguments:
            location: NYC
        normal_text: ''
      vllm: *d_13
      sglang: *d_13
  TOOLCALLING.batch.13.c:
    description: Mixed known and unknown calls
    ref: *local_ref
    model_text: '<|message_model|>get_weather<|content_invoke_tool_json|>{"name":"get_weather","args":{"location":"NYC"}}<|end_message|><|message_model|>unknown_tool<|content_invoke_tool_json|>{"name":"unknown_tool","args":{"location":"LA"}}<|end_message|>'
    tools:
    - *weather_tool
    expected:
      dynamo: &d_13c
        calls:
        - name: get_weather
          arguments:
            location: NYC
        - name: unknown_tool
          arguments:
            location: LA
        normal_text: ''
      vllm: *d_13c
      sglang: *d_13c
